          package com.example.lan_cam

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import java.net.InetSocketAddress
          import java.net.ServerSocket
          import java.net.Socket

          @Suppress("DEPRECATION")
          class CamService : Service() {
              private var wake: PowerManager.WakeLock? = null
              private var wifi: WifiManager.WifiLock? = null
              private var listener: Thread? = null
              private var server: ServerSocket? = null
              private var wakeFails = 0
              private var wakeLockUntil = 0L
              @Volatile private var stopping = false

              override fun onBind(intent: Intent?): IBinder? = null

              private fun prefs() = getSharedPreferences("lancam", Context.MODE_PRIVATE)

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  // null intent = restarted by the system after a kill -> standby mode
                  val action = intent?.action ?: ACTION_STANDBY
                  if (action == ACTION_STOP) {
                      stopForeground(true)
                      stopSelf()
                      android.os.Process.killProcess(android.os.Process.myPid())
                      return START_NOT_STICKY
                  }
                  val camera = action == ACTION_CAMERA

                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(
                          NotificationChannel(CHANNEL, "LAN Cam", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val open = packageManager.getLaunchIntentForPackage(packageName) ?: Intent()
                  val piFlags = PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  val openPi = PendingIntent.getActivity(this, 0, open, piFlags)
                  val stopPi = PendingIntent.getService(
                      this, 1, Intent(this, CamService::class.java).setAction(ACTION_STOP), piFlags
                  )
                  val b = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL)
                  } else {
                      Notification.Builder(this)
                  }
                  val n = b.setContentTitle("LAN Cam")
                      .setContentText(if (camera) "الكاميرا تعمل في الخلفية" else "جاهزة للاتصال في أي وقت")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentIntent(openPi)
                      .setOngoing(true)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "إيقاف", stopPi)
                      .build()

                  try {
                      val type: Int = if (camera) {
                          var t = ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA or
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                          if (Build.VERSION.SDK_INT >= 34) {
                              t = t or ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                          }
                          t
                      } else if (Build.VERSION.SDK_INT >= 34) {
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      } else {
                          0
                      }
                      if (Build.VERSION.SDK_INT >= 30 && type != 0) {
                          startForeground(1, n, type)
                      } else {
                          startForeground(1, n)
                      }
                  } catch (e: Exception) {
                      running = false
                      lastError = "startForeground: " + e.toString()
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  running = true

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (wake == null) {
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "lancam:wake").apply {
                          setReferenceCounted(false)
                          acquire()
                      }
                  }
                  val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  if (wifi == null) {
                      val mode = if (Build.VERSION.SDK_INT >= 29) {
                          WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                      } else {
                          WifiManager.WIFI_MODE_FULL_HIGH_PERF
                      }
                      wifi = wm.createWifiLock(mode, "lancam:wifi").apply {
                          setReferenceCounted(false)
                          acquire()
                      }
                  }

                  val always = prefs().getBoolean("always", false)
                  if (always) startListener() else stopListener()
                  return if (always) START_STICKY else START_NOT_STICKY
              }

              // ── standby listener: a viewer sends "WAKE:<pin>" to open the app ──
              private fun startListener() {
                  if (listener?.isAlive == true) return
                  stopping = false
                  val t = Thread {
                      try {
                          val ss = ServerSocket()
                          ss.reuseAddress = true
                          ss.bind(InetSocketAddress(WAKE_PORT))
                          server = ss
                          listening = true
                          while (!Thread.currentThread().isInterrupted) {
                              val c = ss.accept()
                              handleClient(c)
                          }
                      } catch (e: Exception) {
                          if (!stopping) lastError = "listener: " + e.toString()
                      } finally {
                          listening = false
                      }
                  }
                  t.isDaemon = true
                  listener = t
                  t.start()
              }

              private fun stopListener() {
                  stopping = true
                  try { server?.close() } catch (e: Exception) {}
                  listener?.interrupt()
                  server = null
                  listener = null
                  listening = false
              }
              private fun handleClient(c: Socket) {
                  try {
                      c.soTimeout = 3000
                      val line = c.getInputStream().bufferedReader().readLine()
                      if (line.isNullOrEmpty()) return // plain port probe (network scan)
                      val p = prefs()
                      val pin = p.getString("pin", "") ?: ""
                      val now = System.currentTimeMillis()
                      val locked = now < wakeLockUntil
                      val ok = !locked && p.getBoolean("always", false) && pin.isNotEmpty() && line.trim() == "WAKE:" + pin
                      if (ok) {
                          wakeFails = 0
                          wakeApp()
                          c.getOutputStream().write("OK\n".toByteArray())
                      } else {
                          if (!locked) {
                              wakeFails++
                              if (wakeFails >= 5) {
                                  wakeLockUntil = now + 300000L
                                  wakeFails = 0
                              }
                          }
                          Thread.sleep(1000) // slow down PIN guessing
                          c.getOutputStream().write("DENIED\n".toByteArray())
                      }
                      c.getOutputStream().flush()
                  } catch (e: Exception) {
                  } finally {
                      try { c.close() } catch (e: Exception) {}
                  }
              }

              private fun wakeApp() {
                  val i = packageManager.getLaunchIntentForPackage(packageName) ?: return
                  i.addFlags(
                      Intent.FLAG_ACTIVITY_NEW_TASK or
                          Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or
                          Intent.FLAG_ACTIVITY_SINGLE_TOP
                  )
                  i.putExtra("autostart", true)
                  try { startActivity(i) } catch (e: Exception) {}
              }

              override fun onDestroy() {
                  running = false
                  stopListener()
                  try { wake?.release() } catch (e: Exception) {}
                  try { wifi?.release() } catch (e: Exception) {}
                  wake = null
                  wifi = null
                  super.onDestroy()
              }

              companion object {
                  @Volatile var running = false
                  @Volatile var listening = false
                  @Volatile var lastError = ""
                  const val ACTION_STOP = "com.example.lan_cam.STOP"
                  const val ACTION_CAMERA = "com.example.lan_cam.CAMERA"
                  const val ACTION_STANDBY = "com.example.lan_cam.STANDBY"
                  const val CHANNEL = "lancam_service"
                  const val WAKE_PORT = 8081
              }
          }
