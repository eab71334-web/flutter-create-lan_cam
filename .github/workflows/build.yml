name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create --platforms=android --org com.example --project-name lan_cam .

      - name: Add Android permissions
        run: |
          sed -i '/<manifest/a \
            <uses-permission android:name="android.permission.INTERNET"/>\
            <uses-permission android:name="android.permission.CAMERA"/>\
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>\
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\
            <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>\
            <uses-permission android:name="android.permission.WAKE_LOCK"/>\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA"/>\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>\
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>' \
            android/app/src/main/AndroidManifest.xml

      - name: Add background camera service (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <service android:name=".CamService" android:exported="false" android:foregroundServiceType="camera|microphone" android:stopWithTask="false" />\n    </application>#' $M
          D=android/app/src/main/kotlin/com/example/lan_cam
          rm -f android/app/src/main/java/com/example/lan_cam/MainActivity.java
          mkdir -p $D
          cat > $D/MainActivity.kt << 'EOF'
          package com.example.lan_cam

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.PowerManager
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.embedding.engine.FlutterEngineCache
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {

              // One engine for the whole process: the Dart side (camera server)
              // keeps running after the screen closes or the app is swiped away.
              override fun provideFlutterEngine(context: Context): FlutterEngine? {
                  val cache = FlutterEngineCache.getInstance()
                  var engine = cache.get(ENGINE_ID)
                  if (engine == null) {
                      engine = FlutterEngine(context.applicationContext)
                      cache.put(ENGINE_ID, engine)
                  }
                  return engine
              }

              override fun shouldDestroyEngineWithHost(): Boolean = false

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "lancam/service")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start" -> {
                                  val i = Intent(applicationContext, CamService::class.java)
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      applicationContext.startForegroundService(i)
                                  } else {
                                      applicationContext.startService(i)
                                  }
                                  result.success(true)
                              }
                              "stop" -> {
                                  applicationContext.stopService(Intent(applicationContext, CamService::class.java))
                                  result.success(true)
                              }
                              "battery" -> {
                                  try {
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                                          if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                                              startActivity(
                                                  Intent(
                                                      Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                                      Uri.parse("package:" + packageName)
                                                  )
                                              )
                                          }
                                      }
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.success(false)
                                  }
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              companion object {
                  private const val ENGINE_ID = "lancam_engine"
              }
          }
          EOF
          cat > $D/CamService.kt << 'EOF'
          package com.example.lan_cam

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          @Suppress("DEPRECATION")
          class CamService : Service() {
              private var wake: PowerManager.WakeLock? = null
              private var wifi: WifiManager.WifiLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopForeground(true)
                      stopSelf()
                      android.os.Process.killProcess(android.os.Process.myPid())
                      return START_NOT_STICKY
                  }

                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(
                          NotificationChannel(CHANNEL, "LAN Cam", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val open = packageManager.getLaunchIntentForPackage(packageName) ?: Intent()
                  val piFlags = PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  val openPi = PendingIntent.getActivity(this, 0, open, piFlags)
                  val stopPi = PendingIntent.getService(
                      this, 1, Intent(this, CamService::class.java).setAction(ACTION_STOP), piFlags
                  )
                  val b = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL)
                  } else {
                      Notification.Builder(this)
                  }
                  val n = b.setContentTitle("LAN Cam")
                      .setContentText("الكاميرا تعمل في الخلفية")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentIntent(openPi)
                      .setOngoing(true)
                      .addAction(android.R.drawable.ic_menu_close_clear_cancel, "إيقاف", stopPi)
                      .build()

                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          startForeground(
                              1, n,
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA or
                                  ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                          )
                      } else {
                          startForeground(1, n)
                      }
                  } catch (e: Exception) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (wake == null) {
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "lancam:wake").apply {
                          setReferenceCounted(false)
                          acquire()
                      }
                  }
                  val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                  if (wifi == null) {
                      val mode = if (Build.VERSION.SDK_INT >= 29) {
                          WifiManager.WIFI_MODE_FULL_LOW_LATENCY
                      } else {
                          WifiManager.WIFI_MODE_FULL_HIGH_PERF
                      }
                      wifi = wm.createWifiLock(mode, "lancam:wifi").apply {
                          setReferenceCounted(false)
                          acquire()
                      }
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  try { wake?.release() } catch (e: Exception) {}
                  try { wifi?.release() } catch (e: Exception) {}
                  wake = null
                  wifi = null
                  super.onDestroy()
              }

              companion object {
                  const val ACTION_STOP = "com.example.lan_cam.STOP"
                  const val CHANNEL = "lancam_service"
              }
          }
          EOF
          grep -n "CamService" $M

      - name: Force compileSdk 36 for ALL modules (app + plugins)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-compilesdk.gradle << 'EOF'
          allprojects {
            afterEvaluate { p ->
              def a = p.extensions.findByName('android')
              if (a != null) {
                try { a.compileSdk = 36 } catch (Throwable t) { a.compileSdkVersion(36) }
              }
            }
          }
          EOF
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - run: flutter pub get

      - name: Build APK
        shell: bash
        run: flutter build apk --release --no-shrink 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          MSG=$(cat build*.log | grep -A8 -E "What went wrong" | head -c 1500 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle error::$MSG"

      - uses: actions/upload-artifact@v4
        with:
          name: lan_cam-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create --platforms=ios --project-name lan_cam .

      - name: Add iOS permissions
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera is used for streaming" $P
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Microphone is used for streaming" $P
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Used to connect to the camera on your local network" $P

      - name: Set iOS deployment target
        run: sed -i '' -E "s/^#? ?platform :ios, '[0-9.]+'/platform :ios, '13.0'/" ios/Podfile

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lan_cam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: lan_cam-ipa
          path: lan_cam.ipa
