        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-compilesdk.gradle << 'EOF'
          allprojects {
            afterEvaluate { p ->
              def a = p.extensions.findByName('android')
              if (a != null) {
                try { a.compileSdk = 36 } catch (Throwable t) { a.compileSdkVersion(36) }
              }
            }
          }
          EOF
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

