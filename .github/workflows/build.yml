name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create --platforms=android --project-name lan_cam .

      - name: Add Android permissions
        run: |
          sed -i '/<manifest/a \
            <uses-permission android:name="android.permission.INTERNET"/>\
            <uses-permission android:name="android.permission.CAMERA"/>\
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>\
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' \
            android/app/src/main/AndroidManifest.xml

      - name: Raise compileSdk to 36
        run: |
          sed -i -E 's/compileSdk(Version)? *=? *flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle*
          grep -n compileSdk android/app/build.gradle*

      - run: flutter pub get

      - name: Build APK
        shell: bash
        run: flutter build apk --release --no-shrink 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: grep -B2 -A12 -E "What went wrong|error:|Error:" build.log | head -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: lan_cam-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create --platforms=ios --project-name lan_cam .

      - name: Add iOS permissions
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera is used for streaming" $P
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Microphone is used for streaming" $P
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Used to connect to the camera on your local network" $P

      - name: Set iOS deployment target
        run: sed -i '' -E "s/^#? ?platform :ios, '[0-9.]+'/platform :ios, '13.0'/" ios/Podfile

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lan_cam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: lan_cam-ipa
          path: lan_cam.ipa
