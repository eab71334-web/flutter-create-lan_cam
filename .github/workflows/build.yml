name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ml:
        description: "Build with real person detection (ML Kit) - bigger app"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform folders
        run: flutter create --platforms=android --org com.example --project-name lan_cam .

      - name: Branding (app name + launcher icon)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="LAN Cam"/' $M
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          put() { python3 -c "import base64,sys;open(sys.argv[1],'wb').write(base64.b64decode(sys.stdin.read()))" "$1"; }
          mkdir -p $R/mipmap-mdpi
