      - name: Add iOS permissions
        run: |
          P=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Camera is used for streaming" $P
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Microphone is used for streaming" $P
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Used to connect to the camera on your local network" $P
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Used to save snapshots from the camera" $P
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" $P
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" $P

      - name: Set iOS deployment target
        run: |
          sed -i '' -E "s/^#? ?platform :ios, '[0-9.]+'/platform :ios, '15.5'/" ios/Podfile
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" ios/Runner.xcodeproj/project.pbxproj

