      - name: Enable person detection (ML Kit)
        if: ${{ github.event.inputs.ml == 'true' }}
        run: |
          flutter pub add google_mlkit_face_detection google_mlkit_pose_detection
          cat > lib/person.dart << 'EOF'
          import 'dart:io';
          import 'dart:typed_data';
          
          import 'package:google_mlkit_face_detection/google_mlkit_face_detection.dart';
          import 'package:google_mlkit_pose_detection/google_mlkit_pose_detection.dart';
          import 'package:path_provider/path_provider.dart';
          
          const bool kPersonSupported = true;
          
          FaceDetector? _fd;
          PoseDetector? _pd;
          
          /// A person is present if a face or a body pose is found.
          Future<bool> detectPerson(Uint8List png) async {
            final dir = await getTemporaryDirectory();
            final f = File('${dir.path}/_person.png');
            await f.writeAsBytes(png);
            final input = InputImage.fromFilePath(f.path);
            _fd ??= FaceDetector(
                options: FaceDetectorOptions(
                    performanceMode: FaceDetectorMode.fast, minFaceSize: 0.05));
            final faces = await _fd!.processImage(input);
            if (faces.isNotEmpty) return true;
            _pd ??= PoseDetector(
                options: PoseDetectorOptions(
                    mode: PoseDetectionMode.single, model: PoseDetectionModel.base));
            final poses = await _pd!.processImage(input);
            return poses.isNotEmpty;
          }
          EOF

      - run: flutter pub get

      - name: Build APK
        shell: bash
        run: flutter build apk --release --no-shrink 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          MSG=$(cat build*.log | grep -A8 -E "What went wrong" | head -c 1500 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle error::$MSG"
          K=$(grep -hE "^e: " build*.log | sed -E 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -n 25 | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -n "$K" ]; then echo "::error title=Kotlin errors::$K"; fi
          D=$(grep -hE "\.dart:[0-9]+:[0-9]+: Error|Error when reading|Couldn't resolve|Because .* depends on|version solving failed" build*.log | head -n 25 | head -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')
          if [ -n "$D" ]; then echo "::error title=Dart errors::$D"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: lan_cam-apk
          path: build/app/outputs/flutter-apk/app-release.apk

