      - name: Add Android permissions
        run: |
          sed -i '/<manifest/a \
            <uses-permission android:name="android.permission.INTERNET"/>\
            <uses-permission android:name="android.permission.CAMERA"/>\
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>\
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\
            <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>\
            <uses-permission android:name="android.permission.WAKE_LOCK"/>\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA"/>\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>\
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>\
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>' \
            android/app/src/main/AndroidManifest.xml

      - name: Add background camera service (Android)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          python3 - "$M" << 'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          block = """    <service android:name=".CamService" android:exported="false" android:foregroundServiceType="camera|microphone|specialUse" android:stopWithTask="false">
              <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="local_network_camera_standby" />
          </service>
          <receiver android:name=".BootReceiver" android:exported="true">
              <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED" />
              </intent-filter>
          </receiver>
          </application>"""
          s = s.replace("</application>", block, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          D=android/app/src/main/kotlin/com/example/lan_cam
          rm -f android/app/src/main/java/com/example/lan_cam/MainActivity.java
          mkdir -p $D
          cat > $D/MainActivity.kt << 'EOF'
          package com.example.lan_cam

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.media.projection.MediaProjectionManager
          import android.net.wifi.WifiManager
          import android.os.BatteryManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.embedding.engine.FlutterEngineCache
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var pendingAutostart = false

              // One engine for the whole process: the Dart side (camera server)
              // keeps running after the screen closes or the app is swiped away.
              override fun provideFlutterEngine(context: Context): FlutterEngine? {
                  val cache = FlutterEngineCache.getInstance()
                  var engine = cache.get(ENGINE_ID)
                  if (engine == null) {
                      engine = FlutterEngine(context.applicationContext)
                      cache.put(ENGINE_ID, engine)
                  }
                  return engine
              }

              override fun shouldDestroyEngineWithHost(): Boolean = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  handleLaunchIntent(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  handleLaunchIntent(intent)
              }

              // Started by the standby service when a viewer wakes the camera.
              private fun handleLaunchIntent(i: Intent?) {
                  if (i?.getBooleanExtra("autostart", false) == true) {
                      pendingAutostart = true
                      if (Build.VERSION.SDK_INT >= 27) {
                          setShowWhenLocked(true)
                          setTurnScreenOn(true)
                      }
                  }
              }

              // result of the "record your screen?" system dialog
              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_SCREEN) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val i = Intent(applicationContext, ScreenService::class.java)
                          i.putExtra("code", resultCode)
                          i.putExtra("data", data)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              applicationContext.startForegroundService(i)
                          } else {
                              applicationContext.startService(i)
                          }
                      } else {
                          ScreenBridge.lastError = "تم رفض إذن مشاركة الشاشة"
                      }
                  }
              }

              private fun startSvc(action: String) {
                  val i = Intent(applicationContext, CamService::class.java).setAction(action)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      applicationContext.startForegroundService(i)
                  } else {
                      applicationContext.startService(i)
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  if (ScreenBridge.channelFor !== flutterEngine) {
                      ScreenBridge.channelFor = flutterEngine
                      EventChannel(flutterEngine.dartExecutor.binaryMessenger, "lancam/screen")
                          .setStreamHandler(object : EventChannel.StreamHandler {
                              override fun onListen(arguments: Any?, events: EventChannel.EventSink?) {
                                  ScreenBridge.sink = events
                              }

                              override fun onCancel(arguments: Any?) {
                                  ScreenBridge.sink = null
                              }
                          })
                  }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "lancam/service")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start" -> {
                                  startSvc(CamService.ACTION_CAMERA)
                                  result.success(true)
                              }
                              "standby" -> {
                                  startSvc(CamService.ACTION_STANDBY)
                                  result.success(true)
                              }
                              "stop" -> {
                                  applicationContext.stopService(Intent(applicationContext, CamService::class.java))
                                  result.success(true)
                              }
                              "config" -> {
                                  val ed = getSharedPreferences("lancam", Context.MODE_PRIVATE).edit()
                                  val always = call.argument<Boolean>("always")
                                  val pin = call.argument<String>("pin")
                                  if (always != null) ed.putBoolean("always", always)
                                  if (pin != null) ed.putString("pin", pin)
                                  ed.apply()
                                  result.success(true)
                              }
                              "hasOverlay" -> {
                                  result.success(if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) Settings.canDrawOverlays(this) else true)
                              }
                              "overlay" -> {
                                  try {
                                      startActivity(
                                          Intent(
                                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                              Uri.parse("package:" + packageName)
                                          )
                                      )
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.success(false)
                                  }
                              }
                              "toBack" -> {
                                  moveTaskToBack(true)
                                  result.success(true)
                              }
                              "consumeAutostart" -> {
                                  val v = pendingAutostart
                                  pendingAutostart = false
                                  result.success(v)
                              }
                              "screenStart" -> {
                                  try {
                                      ScreenBridge.lastError = ""
                                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                                      startActivityForResult(mpm.createScreenCaptureIntent(), REQ_SCREEN)
                                      result.success(true)
                                  } catch (e: Exception) {
                                      ScreenBridge.lastError = "screenStart: " + e.toString()
                                      result.success(false)
                                  }
                              }
                              "screenStop" -> {
                                  applicationContext.stopService(Intent(applicationContext, ScreenService::class.java))
                                  ScreenBridge.wanted = false
                                  result.success(true)
                              }
                              "screenWanted" -> {
                                  ScreenBridge.wanted = call.argument<Boolean>("on") ?: false
                                  result.success(true)
                              }
                              "screenConfig" -> {
                                  call.argument<Int>("fps")?.let { ScreenBridge.fps = it }
                                  call.argument<Int>("quality")?.let { ScreenBridge.quality = it }
                                  call.argument<Int>("maxSide")?.let { ScreenBridge.maxSide = it }
                                  result.success(true)
                              }
                              "screenInfo" -> {
                                  val m = HashMap<String, Any>()
                                  m["w"] = ScreenBridge.realW
                                  m["h"] = ScreenBridge.realH
                                  m["running"] = ScreenBridge.running
                                  m["error"] = ScreenBridge.lastError
                                  m["control"] = ControlService.instance != null
                                  result.success(m)
                              }
                              "openAccessibility" -> {
                                  try {
                                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.success(false)
                                  }
                              }
                              "tap" -> {
                                  val x = (call.argument<Double>("x") ?: 0.0).toFloat()
                                  val yy = (call.argument<Double>("y") ?: 0.0).toFloat()
                                  ControlService.instance?.gesture(x, yy, x, yy, 60)
                                  result.success(ControlService.instance != null)
                              }
                              "swipe" -> {
                                  val x1 = (call.argument<Double>("x1") ?: 0.0).toFloat()
                                  val y1 = (call.argument<Double>("y1") ?: 0.0).toFloat()
                                  val x2 = (call.argument<Double>("x2") ?: 0.0).toFloat()
                                  val y2 = (call.argument<Double>("y2") ?: 0.0).toFloat()
                                  val ms = (call.argument<Int>("ms") ?: 300).toLong()
                                  ControlService.instance?.gesture(x1, y1, x2, y2, ms)
                                  result.success(ControlService.instance != null)
                              }
                              "touch" -> {
                                  val ta = call.argument<String>("a") ?: ""
                                  val nx = (call.argument<Double>("x") ?: 0.0).toFloat()
                                  val ny = (call.argument<Double>("y") ?: 0.0).toFloat()
                                  val rw = if (ScreenBridge.realW > 0) ScreenBridge.realW else 1
                                  val rh = if (ScreenBridge.realH > 0) ScreenBridge.realH else 1
                                  ControlService.instance?.touch(ta, nx * rw, ny * rh)
                                  result.success(ControlService.instance != null)
                              }

                              "nav" -> {
                                  ControlService.instance?.global(call.argument<String>("action") ?: "")
                                  result.success(ControlService.instance != null)
                              }
                              "status" -> {
                                  val m = HashMap<String, Any>()
                                  m["running"] = CamService.running
                                  m["listening"] = CamService.listening
                                  m["error"] = CamService.lastError
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                      m["overlay"] = Settings.canDrawOverlays(this)
                                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                                      m["battery"] = pm.isIgnoringBatteryOptimizations(packageName)
                                  } else {
                                      m["overlay"] = true
                                      m["battery"] = true
                                  }
                                  result.success(m)
                              }
                              "battery" -> {
                                  try {
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                                          if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                                              startActivity(
                                                  Intent(
                                                      Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                                      Uri.parse("package:" + packageName)
                                                  )
                                              )
                                          }
                                      }
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.success(false)
                                  }
                              }
                              "health" -> {
                                  val m = HashMap<String, Any>()
                                  try {
                                      val bi = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                                      if (bi != null) {
                                          val t = bi.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, -1)
                                          if (t >= 0) m["temp"] = t / 10.0
                                      }
                                  } catch (e: Exception) {}
                                  try {
                                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                                      @Suppress("DEPRECATION")
                                      val rssi = wm.connectionInfo?.rssi
                                      if (rssi != null && rssi > -127) m["rssi"] = rssi
                                  } catch (e: Exception) {}
                                  result.success(m)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              companion object {
                  private const val ENGINE_ID = "lancam_engine"
