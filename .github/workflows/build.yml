          package com.example.lan_cam

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import io.flutter.plugin.common.EventChannel
          import java.io.ByteArrayOutputStream

          object ScreenBridge {
              @Volatile var sink: EventChannel.EventSink? = null
              @Volatile var channelFor: Any? = null
              @Volatile var running = false
              @Volatile var wanted = false
              @Volatile var fps = 10
              @Volatile var quality = 60
              @Volatile var maxSide = 1280
              @Volatile var realW = 0
              @Volatile var realH = 0
              @Volatile var lastError = ""
              private val main = Handler(Looper.getMainLooper())

              fun deliver(b: ByteArray) {
                  val s = sink ?: return
                  main.post {
                      try { s.success(b) } catch (e: Exception) {}
                  }
              }
          }

          @Suppress("DEPRECATION")
          class ScreenService : Service() {
              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var thread: HandlerThread? = null
              private var lastSent = 0L
              private var frameBmp: Bitmap? = null
              private val frameBos = ByteArrayOutputStream(1 shl 17)
              private var handler: Handler? = null
              private var curW = 0
              private var curH = 0
              private var dl: DisplayManager.DisplayListener? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val code = intent?.getIntExtra("code", 0) ?: 0
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent?.getParcelableExtra("data", Intent::class.java)
                  } else {
                      intent?.getParcelableExtra<Intent>("data")
                  }
                  if (data == null || code == 0) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  cleanup()

                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(
                          NotificationChannel(CHANNEL, "LAN Cam screen", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val b = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL)
                  } else {
                      Notification.Builder(this)
                  }
                  val n = b.setContentTitle("LAN Cam")
                      .setContentText("مشاركة الشاشة شغالة")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setOngoing(true)
                      .build()
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(2, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                      } else {
                          startForeground(2, n)
                      }
                  } catch (e: Exception) {
                      ScreenBridge.lastError = "screen fgs: " + e.toString()
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  try {
                      val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      val proj = mpm.getMediaProjection(code, data)
                      if (proj == null) {
                          ScreenBridge.lastError = "getMediaProjection returned null"
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      projection = proj
                      val t = HandlerThread("lancam-screen")
                      t.start()
                      thread = t
                      val h = Handler(t.looper)
                      // required by Android 14+ before creating the virtual display
                      proj.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() {
                              stopSelf()
                          }
                      }, h)

                      val dm = DisplayMetrics()
                      val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      wm.defaultDisplay.getRealMetrics(dm)
                      ScreenBridge.realW = dm.widthPixels
                      ScreenBridge.realH = dm.heightPixels
                      val longSide = Math.max(dm.widthPixels, dm.heightPixels).toFloat()
                      val scale = Math.min(1f, ScreenBridge.maxSide.toFloat() / longSide)
                      val w = ((dm.widthPixels * scale).toInt() / 16) * 16
                      val hh = ((dm.heightPixels * scale).toInt() / 2) * 2

                      val r = ImageReader.newInstance(w, hh, PixelFormat.RGBA_8888, 2)
                      reader = r
                      display = proj.createVirtualDisplay(
                          "lancam", w, hh, dm.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          r.surface, null, h
                      )
                      r.setOnImageAvailableListener({ rd -> onFrame(rd, w, hh) }, h)
                      handler = h
                      curW = w
                      curH = hh
                      val dmgr = getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                      val dlis = object : DisplayManager.DisplayListener {
                          override fun onDisplayAdded(displayId: Int) {}
                          override fun onDisplayRemoved(displayId: Int) {}
                          override fun onDisplayChanged(displayId: Int) {
                              if (displayId == android.view.Display.DEFAULT_DISPLAY) rebuild()
                          }
                      }
                      dmgr.registerDisplayListener(dlis, h)
                      dl = dlis
                      ScreenBridge.running = true
                      ScreenBridge.lastError = ""
                  } catch (e: Exception) {
                      ScreenBridge.lastError = "screen: " + e.toString()
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              private fun onFrame(rd: ImageReader?, w: Int, h: Int) {
                  val img = (try { rd?.acquireLatestImage() } catch (e: Exception) { null }) ?: return
                  try {
                      if (!ScreenBridge.wanted || ScreenBridge.sink == null) return
                      val now = System.currentTimeMillis()
                      if (now - lastSent < 1000L / Math.max(1, ScreenBridge.fps)) return
                      lastSent = now
                      val plane = img.planes[0]
                      val pixelStride = plane.pixelStride
                      val rowPadding = plane.rowStride - pixelStride * w
                      val bw = w + rowPadding / pixelStride
                      var bmp0 = frameBmp
                      if (bmp0 == null || bmp0.width != bw || bmp0.height != h) {
                          bmp0 = Bitmap.createBitmap(bw, h, Bitmap.Config.ARGB_8888)
                          frameBmp = bmp0
                      }
                      val bmp: Bitmap = bmp0!!
                      bmp.copyPixelsFromBuffer(plane.buffer)
                      val out = if (rowPadding == 0) bmp else Bitmap.createBitmap(bmp, 0, 0, w, h)
                      val bos = frameBos
                      bos.reset()
                      bos.write(w shr 8)
                      bos.write(w and 255)
                      bos.write(h shr 8)
                      bos.write(h and 255)
                      out.compress(Bitmap.CompressFormat.JPEG, ScreenBridge.quality, bos)
                      if (out !== bmp) out.recycle()
                                ScreenBridge.deliver(bos.toByteArray())
                  } catch (e: Exception) {
                      ScreenBridge.lastError = "frame: " + e.toString()
                  } finally {
                      img.close()
                  }
              }

              // The phone was rotated (portrait <-> landscape): resize the capture.
              private fun rebuild() {
                  val d = display ?: return
                  val hd = handler ?: return
                  try {
                      val dm = DisplayMetrics()
                      val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      wm.defaultDisplay.getRealMetrics(dm)
                      ScreenBridge.realW = dm.widthPixels
                      ScreenBridge.realH = dm.heightPixels
                      val longSide = Math.max(dm.widthPixels, dm.heightPixels).toFloat()
                      val scale = Math.min(1f, ScreenBridge.maxSide.toFloat() / longSide)
                      val nw = ((dm.widthPixels * scale).toInt() / 16) * 16
                      val nh = ((dm.heightPixels * scale).toInt() / 2) * 2
                      if (nw == curW && nh == curH) return
                      curW = nw
                      curH = nh
                      val old = reader
                      val nr = ImageReader.newInstance(nw, nh, PixelFormat.RGBA_8888, 2)
                      nr.setOnImageAvailableListener({ rd -> onFrame(rd, nw, nh) }, hd)
                      d.resize(nw, nh, dm.densityDpi)
                      d.setSurface(nr.surface)
                      reader = nr
                      try { old?.setOnImageAvailableListener(null, null) } catch (e: Exception) {}
                      try { old?.close() } catch (e: Exception) {}
                  } catch (e: Exception) {
                      ScreenBridge.lastError = "rotate: " + e.toString()
                  }
              }

              private fun cleanup() {
                  try {
                      dl?.let { (getSystemService(Context.DISPLAY_SERVICE) as DisplayManager).unregisterDisplayListener(it) }
                  } catch (e: Exception) {}
                  dl = null
                  ScreenBridge.running = false
                  try { reader?.setOnImageAvailableListener(null, null) } catch (e: Exception) {}
                  try { display?.release() } catch (e: Exception) {}
                  try { reader?.close() } catch (e: Exception) {}
                  try { projection?.stop() } catch (e: Exception) {}
                  try { thread?.quitSafely() } catch (e: Exception) {}
                  display = null
                  reader = null
                  projection = null
                  thread = null
              }

              override fun onDestroy() {
                  cleanup()
                  super.onDestroy()
              }

              companion object {
                  const val CHANNEL = "lancam_screen"
              }
          }
          EOF
          cat > $D/ControlService.kt << 'EOF'
          package com.example.lan_cam

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Intent
          import android.graphics.Path
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent

          // Lets the paired viewer tap / swipe / press Back-Home on this phone.
          // Works only after the user enables it in Settings > Accessibility.
          class ControlService : AccessibilityService() {
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  instance = null
                  super.onDestroy()
              }

              fun gesture(x1: Float, y1: Float, x2: Float, y2: Float, ms: Long) {
                  val p = Path()
                  p.moveTo(x1, y1)
                  if (x1 != x2 || y1 != y2) p.lineTo(x2, y2)
                  val d = Math.max(1L, ms)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, d))
                      .build()
                  dispatchGesture(g, null, null)
              }

              // ── continuous touch: the stroke follows the viewer's finger ──
              private val mainH = Handler(Looper.getMainLooper())
              private var stroke: GestureDescription.StrokeDescription? = null
              private var lastX = 0f
              private var lastY = 0f
              private var pendX = 0f
              private var pendY = 0f
              private var hasPend = false
              private var inFlight = false
              private var ending = false
              private var endX = 0f
              private var endY = 0f
              private var gen = 0
              private val watchdog = Runnable { touchAbort() }

              fun touch(a: String, x: Float, y: Float) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                      if (a == "u") gesture(x, y, x, y, 60)
                      return
                  }
                  mainH.removeCallbacks(watchdog)
                  when (a) {
                      "d" -> {
                          gen++
                          hasPend = false
                          ending = false
                          inFlight = false
                          lastX = x
                          lastY = y
                          val p = Path()
                          p.moveTo(x, y)
                          val st = GestureDescription.StrokeDescription(p, 0, 20, true)
                          stroke = st
                          sendStroke(st)
                          mainH.postDelayed(watchdog, 4000)
                      }
                      "m" -> {
                          if (stroke == null) return
                          pendX = x
                          pendY = y
                          hasPend = true
                          if (!inFlight) pump()
                          mainH.postDelayed(watchdog, 4000)
                      }
                      "u" -> {
                          if (stroke == null) return
                          ending = true
                          endX = x
                          endY = y
                          if (!inFlight) pump()
                      }
                  }
              }

              private fun touchAbort() {
                  if (stroke == null) return
                  ending = true
                  endX = lastX
                  endY = lastY
                  if (!inFlight) pump()
              }

              private fun sendStroke(st: GestureDescription.StrokeDescription) {
                  val myGen = gen
                  inFlight = true
                  val ok = dispatchGesture(
                      GestureDescription.Builder().addStroke(st).build(),
                      object : GestureResultCallback() {
                          override fun onCompleted(g: GestureDescription?) {
                              if (myGen == gen) {
                                  inFlight = false
                                  pump()
                              }
                          }
                          override fun onCancelled(g: GestureDescription?) {
                              if (myGen == gen) {
                                  inFlight = false
                                  stroke = null
                                  hasPend = false
                                  ending = false
                              }
                          }
                      }, null
                  )
                  if (!ok) {
                      inFlight = false
                      stroke = null
                  }
              }

              private fun pump() {
                  val cur = stroke ?: return
                  if (inFlight) return
                  if (!hasPend && !ending) return
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return
                  val fin = ending
                  val tx = if (fin) endX else pendX
                  val ty = if (fin) endY else pendY
                  val p = Path()
                  p.moveTo(lastX, lastY)
                  if (tx != lastX || ty != lastY) p.lineTo(tx, ty)
                  val seg = cur.continueStroke(p, 0, if (fin) 15L else 10L, !fin)
                  lastX = tx
                  lastY = ty
                  hasPend = false
                  if (fin) {
                      ending = false
                      stroke = null
                  } else {
                      stroke = seg
                  }
                  sendStroke(seg)
              }

              fun global(action: String) {
                  val a = when (action) {
                      "back" -> GLOBAL_ACTION_BACK
                      "home" -> GLOBAL_ACTION_HOME
                      "recents" -> GLOBAL_ACTION_RECENTS
                      "notifications" -> GLOBAL_ACTION_NOTIFICATIONS
                      else -> return
                  }
                  performGlobalAction(a)
              }

              companion object {
                  @Volatile var instance: ControlService? = null
              }
          }
          EOF
